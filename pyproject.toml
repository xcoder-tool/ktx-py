[project]
name = "ktx"
version = "0.1.0"
description = "A library for converting textures from and to ktx using cli tools such as ktx-tool and pvrtextool"
readme = "README.md"
authors = [{ name = "Danila Schelkov", email = "me@donutquine.dev" }]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://github.com/xcoder-tool/ktx-py"
Repository = "https://github.com/xcoder-tool/ktx-py.git"
Issues = "https://github.com/xcoder-tool/ktx-py/issues"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.isort]
profile = "black"
force_sort_within_sections = true # Don't group `from` imports separately
order_by_type = true              # Order by CONSTANT, CamelCase, snake_case
